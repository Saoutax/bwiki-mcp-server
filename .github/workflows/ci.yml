name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24, 26]
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 12.6.0

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            - name: Typecheck
              run: pnpm run typecheck

            - name: Build
              run: pnpm run build

            - name: Check bundle entry
              run: node dist/bundle.cjs --help

            - name: Offline guard tests
              env:
                  CONFIG: ${{ runner.temp }}/ci-config.json
              run: |
                  printf '{"wikis":["ci-wiki"]}\n' > "$CONFIG"
                  pnpm run test:guard
